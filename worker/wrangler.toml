name = "repcam-strava"
main = "strava-worker.js"
compatibility_date = "2026-10-01"
[vars]
ALLOWED_ORIGINS = "https://rnrune.github.io"

DROPBOX_ROOT = ""  # "" = root of the App-folder app (/Apps/Newrun Lift-klipp). Full-Dropbox app: "/Newrun Lift-klipp"

