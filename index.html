<!doctype html><html lang="nb"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="RepCam">
<meta name="theme-color" content="#000000"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<title>RepCam – Knebøy</title>
<style>
:root{--g:#39ff6a}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mirror{transform:scaleX(-1)}
.chip{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:999px;background:rgba(20,20,20,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-weight:600;border:1px solid rgba(255,255,255,.15)}
.chip b{color:var(--g)}
#flip{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:14px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(20,20,20,.6);color:#fff;font-size:20px;backdrop-filter:blur(14px)}
#ringwrap{position:fixed;top:22%;left:50%;transform:translateX(-50%);width:190px;height:190px}
#ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
#reps{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:800;text-shadow:0 2px 20px rgba(0,0,0,.7)}
#hint{position:fixed;top:calc(22% + 205px);left:50%;transform:translateX(-50%);background:rgba(255,170,0,.85);color:#000;padding:6px 14px;border-radius:12px;font-weight:600;display:none;white-space:nowrap}
.card{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);padding:16px;border-radius:24px;background:rgba(25,25,25,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kg button{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:24px}
.kg span{font-size:22px;font-weight:700;min-width:90px;text-align:center;display:inline-block}
.big{width:100%;margin-top:12px;padding:16px;border:0;border-radius:16px;background:var(--g);color:#000;font-size:18px;font-weight:800}
#log{margin-top:10px;max-height:84px;overflow:auto;font-size:13px;color:#bbb}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#000;z-index:10;text-align:center;padding:24px}
#start button{width:auto;padding:18px 36px}
#status{color:#aaa;font-size:14px}
</style></head><body>
<div id="stage"><video id="v" playsinline muted autoplay></video><canvas id="c"></canvas></div>
<div class="chip">✨ <b>Knebøy</b></div>
<button id="flip" aria-label="Bytt kamera">⟲</button>
<div id="ringwrap"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="7"/><circle id="ring" cx="50" cy="50" r="44" fill="none" stroke="#39ff6a" stroke-width="7" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="276.5"/></svg><div id="reps">0</div></div>
<div id="hint">Få hele kroppen i bildet</div>
<div class="card"><div class="row"><div><div style="font-size:13px;color:#aaa">Sett</div><div id="setno" style="font-size:22px;font-weight:700">Sett 1</div></div>
<div class="kg"><button id="minus">−</button><span id="kg">20 kg</span><button id="plus">+</button></div></div>
<button class="big" id="confirm">Bekreft sett</button><div id="log"></div></div>
<div id="start"><div style="font-size:28px;font-weight:800">RepCam ✨</div><div>Teller knebøy med kameraet – alt skjer på telefonen.</div>
<button class="big" id="go">Start kamera</button><div id="status"></div></div>
<script src="reps.js"></script>
<script type="module" src="app.js"></script>
</body></html>
