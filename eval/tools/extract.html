<!doctype html><html><body><video id="v" muted playsinline></video><script type="module">
const V='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const { PoseLandmarker, FilesetResolver } = await import(V+'/vision_bundle.mjs');
const fs = await FilesetResolver.forVisionTasks(V+'/wasm');
window.extract = async (src, fps) => {
  const lm = await PoseLandmarker.createFromOptions(fs, { baseOptions: { modelAssetPath: 'pose_landmarker_lite.task', delegate: 'CPU' }, runningMode: 'VIDEO', numPoses: 1 });
  const v = document.getElementById('v'); v.src = src;
  await new Promise((r, j) => { v.onloadeddata = r; v.onerror = () => j(new Error('load ' + src)); });
  const frames = [], n = Math.floor(v.duration * fps);
  for (let i = 0; i < n; i++) {
    v.currentTime = i / fps + 0.001; await new Promise(r => v.onseeked = r);
    const res = lm.detectForVideo(v, Math.round(i * 1000 / fps) + 1);
    const p = res.landmarks?.[0];
    frames.push(p ? p.map(q => [+q.x.toFixed(4), +q.y.toFixed(4), +q.z.toFixed(4), +(q.visibility ?? 0).toFixed(3)]) : null);
  }
  lm.close();
  return { fps, w: v.videoWidth, h: v.videoHeight, frames };
};
window.ready = true;
</script></body></html>
